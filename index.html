<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="청렴 신고 사건을 신고유형과 처리상태별로 빠르게 조회합니다.">
  <title>청렴 신고 사건 조회</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0}header{background:#123b65;color:white;padding:28px 20px}
    .wrap{max-width:1120px;margin:auto;padding:0 18px}header h1{margin:0 0 8px;font-size:clamp(1.5rem,3vw,2.15rem)}
    header p{margin:0;color:#dce9f5}.main{padding:24px 0 44px}
    .panel{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 3px 12px #17324d0b}
    .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
    label{display:block;font-weight:700;font-size:.92rem;margin-bottom:7px}
    select,input{width:100%;padding:11px 12px;border:1px solid #c8d3df;border-radius:8px;background:#fff;font:inherit;color:inherit}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 14px}
    .count{font-size:1.15rem;font-weight:800;color:#123b65}.muted{color:#5c6b7c;font-size:.9rem}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .case{background:#fff;border:1px solid #dfe7ef;border-radius:12px;padding:17px;box-shadow:0 2px 8px #17324d08}
    .case-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
    .type{font-weight:800;color:#123b65;font-size:1.05rem}.status{font-size:.78rem;font-weight:700;border-radius:99px;padding:5px 9px;background:#e8f1fb;color:#1d4e7a;white-space:nowrap}
    .status.done{background:#e6f5ec;color:#17653a}.status.progress{background:#fff1d6;color:#805400}
    dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:.93rem}dt{color:#64748b}dd{margin:0;font-weight:600}
    .empty{padding:36px;text-align:center;color:#64748b;background:#fff;border:1px dashed #c8d3df;border-radius:12px}
    .rss-list{list-style:none;margin:0;padding:0}.rss-list li{padding:12px 0;border-bottom:1px solid #edf1f5}.rss-list li:last-child{border-bottom:0}
    .rss-list a{font-weight:700;color:#164f80;text-decoration:none}.rss-list a:hover{text-decoration:underline}
    .rss-date{display:block;font-size:.82rem;color:#667789;margin-top:4px}.rss-note{font-size:.86rem;color:#64748b;margin-top:12px}
    footer{padding:20px 0;color:#64748b;font-size:.85rem}
    @media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards,.filters{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>청렴 신고 사건 조회</h1><p>신고유형과 처리상태를 선택해 사건 정보를 빠르게 확인하세요.</p></div></header>
<main class="wrap main">
  <section class="panel" aria-label="신고 검색"><div class="filters">
    <div><label for="typeFilter">신고유형</label><select id="typeFilter"><option value="">전체 유형</option></select></div>
    <div><label for="statusFilter">처리상태</label><select id="statusFilter"><option value="">전체 상태</option></select></div>
    <div><label for="keyword">검색어 (선택)</label><input id="keyword" type="search" placeholder="신고유형 또는 처리상태 검색"></div>
  </div></section>
  <div class="summary"><div class="count" id="resultCount" aria-live="polite">결과 0건</div><div class="muted">신고일자 · 신고유형 · 지역 · 처리상태</div></div>
  <section id="caseCards" class="cards" aria-label="신고 사건 목록"></section>
  <div id="empty" class="empty" hidden>조건에 맞는 신고 사건이 없습니다.</div>
  <section class="panel" style="margin-top:24px"><h2 style="margin:0 0 6px;font-size:1.2rem">한이온 인기 기사</h2>
    <p class="muted" style="margin:0 0 10px">한이온 인기 기사 RSS에서 최신 항목을 불러옵니다.</p>
    <ul id="rssList" class="rss-list"><li>RSS 피드를 불러오는 중입니다…</li></ul>
    <p id="rssNote" class="rss-note">RSS 자동 조회가 실패하면 <a href="https://www.hanion.co.kr/rss/clickTop.xml" target="_blank" rel="noopener noreferrer">한이온 RSS</a>를 확인하세요.</p>
  </section>
  <footer>※ 화면에는 신고일자, 신고유형, 지역, 처리상태만 표시합니다. 실제 공개 전에는 원자료의 공개 가능 여부와 비식별 조치 여부를 확인하세요.</footer>
</main>
<script>
const typeFilter=document.getElementById('typeFilter'),statusFilter=document.getElementById('statusFilter'),keyword=document.getElementById('keyword'),cards=document.getElementById('caseCards'),count=document.getElementById('resultCount'),empty=document.getElementById('empty');
let cases=[];
function optionValues(select,values){values.sort((a,b)=>a.localeCompare(b,'ko')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o);});}
function render(){const t=typeFilter.value,s=statusFilter.value,k=keyword.value.trim().toLocaleLowerCase('ko');const filtered=cases.filter(c=>(!t||c['신고유형']===t)&&(!s||c['처리상태']===s)&&(!k||String(c['신고유형']||'').toLocaleLowerCase('ko').includes(k)||String(c['처리상태']||'').toLocaleLowerCase('ko').includes(k)));count.textContent=`결과 ${filtered.length}건`;cards.replaceChildren();filtered.forEach(c=>{const article=document.createElement('article');article.className='case';const top=document.createElement('div');top.className='case-top';const title=document.createElement('div');title.className='type';title.textContent=c['신고유형']||'유형 미상';const st=document.createElement('span');st.className='status'+(c['처리상태']==='처리완료'?' done':(c['처리상태']==='조사중'?' progress':''));st.textContent=c['처리상태']||'상태 미상';top.append(title,st);article.append(top);const dl=document.createElement('dl');[['신고일자',c['신고일자']||'미상'],['지역',c['지역']||'미상'],['처리상태',c['처리상태']||'미상']].forEach(([label,value])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd);});article.append(dl);cards.append(article);});empty.hidden=filtered.length!==0;}
fetch('./cases.json').then(r=>{if(!r.ok)throw new Error('사건 데이터 불러오기 실패');return r.json();}).then(data=>{cases=data;optionValues(typeFilter,[...new Set(cases.map(c=>c['신고유형']).filter(Boolean))]);optionValues(statusFilter,[...new Set(cases.map(c=>c['처리상태']).filter(Boolean))]);render();}).catch(()=>{count.textContent='데이터를 불러오지 못했습니다';empty.hidden=false;empty.textContent='사건 데이터 파일(cases.json)을 확인해 주세요.';});
[typeFilter,statusFilter].forEach(el=>el.addEventListener('change',render));keyword.addEventListener('input',render);
const rssUrl='https://www.hanion.co.kr/rss/clickTop.xml',rssList=document.getElementById('rssList');
fetch('/api/rss').then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.detail||data.error||'RSS 요청 실패');return data;}).then(data=>{const items=(data.items||[]).slice(0,10);if(!items.length)throw new Error('RSS 항목 없음');rssList.replaceChildren();items.forEach(item=>{const li=document.createElement('li'),a=document.createElement('a'),date=document.createElement('span');a.href=item.link||rssUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title||'제목 없음';date.className='rss-date';const d=item.pubDate?new Date(item.pubDate):null;date.textContent=d&&!isNaN(d)?d.toLocaleDateString('ko-KR'):'날짜 미상';li.append(a,date);rssList.append(li);});document.getElementById('rssNote').textContent='최신 '+items.length+'건 표시 · 원문은 제목을 눌러 확인하세요.';}).catch(error=>{rssList.replaceChildren();const li=document.createElement('li');li.textContent='RSS 자동 조회 실패: '+(error.message||'잠시 후 다시 시도해 주세요.');rssList.append(li);document.getElementById('rssNote').textContent='원본 피드: '+rssUrl;});
</script>
</body>
</html>
